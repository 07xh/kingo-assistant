[package]
name = "kingo-lite"
version = "0.1.0-alpha.1"
description = "KingoAssistant lightweight Windows shell"
authors = ["KingoAssistant contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "kingo_lite"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
