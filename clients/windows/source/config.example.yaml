# Kingosoft elective assistant: personal, read-only, rate-limited.
# Fill only from independently verified, permitted official HTTP contracts. Values below are placeholders, NOT NCWU endpoints.
base_url: "https://jwmis.ncwu.edu.cn"
xnxq: "2026-2027-1"
# Must be replaced with independently verified, published/authorized school policy.
# A self-entered source is not itself evidence of school permission.
server_policy:
  verified: false
  source: ""
  origin: "https://jwmis.ncwu.edu.cn"
  windows: []  # Example shape only: [[60, 1], [3600, 20]]; NOT school limits.
  max_concurrency: 1
  # Raising max_concurrency above 1 gives up the cross-process single-holder
  # lease: the sliding window still bounds this machine, but two clients may be
  # inside an HTTP call concurrently. It is refused unless BOTH keys below are
  # present, so a stray number cannot silently weaken the guarantee.
  # parallel_lease_attested: false
  # parallel_source: ""   # why the single-holder lease is being dropped
  database: "data/request-budget.sqlite"  # resolved under app data directory on Windows
auth:
  # Legacy external session is still supported; never save passwords/cookies here.
  cookie: ""
  # EXE-native login requires a separately verified SAME-ORIGIN official form.
  # Empty placeholders intentionally disable network authentication.
  # This is NOT a working NCWU login endpoint, and CAS/SSO is not yet adapted.
  login:
    # Supported template: direct_form. CAS is identified but not implemented.
    # Choosing mode: cas disables form submission until a reviewed CAS adapter exists.
    mode: direct_form
    verified: false
    # HAR observed PLAIN 2026-11-03 and SIGNED 2026-11-14 forms on SAME URL.
    # plain_20261103 only after independently verifying applicable official mode;
    # signed_20261114 is explicitly unsupported (no stale token replay).
    contract_variant: ""
    # Use the historical no-body YearTerm action to compare returned userCode
    # with the login account IN MEMORY, without inventing an identity endpoint.
    # Still requires an independently verified direct-form login contract,
    # known_year_term.verified, permitted server budget and official challenges.
    identity_mode: year_term
    method: POST
    # Captured in the separately sanitized 2026-11-03 NCWU HAR.
    # The endpoint and field NAMES were observed; values, loginmethod
    # semantics, any CSRF challenge and authenticated identity proof remain
    # unverified. NEVER set verified:true merely from this example.
    path: "/hsjw/cas/logon.action"
    username_field: "username"
    password_field: "password"
    static_fields: {}  # "loginmethod" is observed but its required value is unknown
strategy:
  mode: monitor       # monitor or burst; burst means ONE scheduled read-only check
  target_time: "2026-12-21 08:00:00" # timezone: Asia/Shanghai; confirm official announcement
  interval_range: [60, 60]     # fastest local default; NOT a verified school frequency limit
  max_cycles: 20              # 0 = no cycle-count limit; duration ALWAYS applies
  max_duration_minutes: 480   # 1–1440 minutes; protects unattended runs
  # Lower intervals require manually checking the school's published permission.
  # Do not change this without official evidence. 30 s is the default hard floor.
  official_frequency_policy: {manually_confirmed: false}
  # A floor below 30 s is refused unless ALL THREE keys below are set, so a typo
  # cannot look "safe". Minimum accepted value is 5 s.
  #   absolute_floor_seconds: 10
  #   absolute_floor_verified: true
  #   absolute_floor_source: "教务处 2026-11 公告：允许 10 秒间隔"
  # business_markers control how a response body is classified:
  #   full_markers / window_markers -> next / wait
  #   challenge_markers -> halt (CAPTCHA, slider, SMS, CAS re-auth)
  # A challenge is NEVER retried; retrying it burns attempts against the
  # counter that locks the account.
  # business:
  #   challenge_markers: ["请输入验证码", "请拖动滑块", "短信验证码"]
  # Pickup mode: tighten polling inside known withdrawal peaks (just after the
  # window opens, the hours before the deadline, the first supplementary
  # morning). peak_interval_seconds may NOT go below 30.
  # Disabled by default because the peak times below are an example, not a
  # verified NCWU schedule.
  pickup:
    enabled: false
    peak_interval_seconds: 30
    offpeak_interval_seconds: 60
    peak_windows: []
    # Example shape only:
    # peak_windows:
    #   - {weekday: 0, start: "08:00", end: "09:30", label: "选课首日"}
    #   - {weekday: null, start: "22:00", end: "23:59", label: "截止前"}
  # Adaptive V2: optional READ-ONLY slowdown when real latency/budget waiting
  # indicates load. It never increases the query rate above interval_range,
  # never retries enrollment POST, and does not change the school's policy.
  adaptive_polling:
    enabled: false
    slow_request_ms: 2000
    budget_wait_ms: 200
    max_multiplier: 8
  # Only hashes of observed course+class IDs are stored; no Cookie or HTML.
  state_file: "data/notification-state.json"
  dry_run: true       # always read-only: no enrollment POST
courses:
  - key: A
    course_name: ""
    teacher: ""
    course_id: "FILL_FROM_OFFICIAL_PAGE"
    class_id: ""       # optional exact teaching-class ID; prefer when known
    group: "example-choice"
  - key: B
    course_name: ""
    teacher: ""
    course_id: "SECOND_OPTION_ID"
    group: "example-choice"
notify:
  enabled: false       # explicit opt-in before sending course details to third parties
  include_teacher: false
  pushplus_token: ""  # optional PUSHPLUS_TOKEN env
  serverchan_token: "" # optional SERVERCHAN_TOKEN env
# Observed in the 2026-11-03 NCWU official school-web HAR.
# The actual Nov 03 HAR had `menucode` on timetable_entry and `params`
# on selected_results. Their values cannot be guessed or replayed from HAR.
# The read adapter is disabled until normal official access is verified.
known_school_pages:
  timetable_entry:
    verified: false
    method: GET
    path: "/hsjw/student/xkjg.wdkb.jsp"
    query_verified: false
    query_mode: unverified
  selected_results:
    verified: false
    method: GET
    path: "/hsjw/wsxk/xkjg.ckdgxsxdkchj_data10319.jsp"
    query_verified: false
    # Only if independently accepted: current_yearterm_base64.
    # Compose each params value from this session's showYearTerm.action
    # xn/xqM/userCode and EXE login identity; NEVER replay saved HAR values.
    query_mode: unverified
    # Expected for that independently accepted mode:
    # query_fields: {params: current_yearterm_base64}

# 2026-11-03 and 2026-11-14 captures consistently show an EMPTY-BODY POST
# returning text/plain JSON with year/semester and a user-scoped marker.
# An observed route is not independently verified third-party permission.
known_year_term:
  verified: false
  # A positive userCode in a logged-in HAR is NOT proof anonymous requests
  # cannot produce the same shape. Require authorized identity-binding
  # validation before using this action to mark an EXE login successful.
  identity_binding_verified: false
  method: POST
  path: "/hsjw/jw/common/showYearTerm.action"
  request_mode: empty

# Previously observed real NCWU personal timetable POST (2026-11-11 HAR).
# URL/method and text/plain JSON response confirmed. Request body includes
# dynamic param/param2 fields, NOT safe to copy from HAR or store statically.
# No live request until a permitted, tested dynamic builder exists.
known_timetable:
  verified: false
  method: POST
  path: "/hsjw//wap/mycourseschedule.action"
  body_mode: form        # observed Content-Type: application/x-www-form-urlencoded
  request_fields: {}     # never store token, password or session values here

protocol:
  verified: false    # change to true ONLY after own authorized page validation
  # [TODO: 抓包核对] F12 > Network > Doc/Fetch/XHR > Request URL/Headers.
  identity_path: ""
  identity_referer: "/"
  identity_selector: ""
  entry: ""
  entry_referer: "/"
  list: ""
  list_method: GET
  term_field: ""
  list_fields: {}
  form_selector: "form"
  checkbox_selector: 'input[type="checkbox"]'
  table_marker: ""     # optional confirmed table HTML marker; reject wrong pages
  empty_marker: ""     # optional confirmed empty-list marker; otherwise fail closed
  # Add class_id: N to columns only when the actual table exposes that column.
  columns: {course_id: 1, course_name: 2, teacher: 3, remain: 4}
  # The following are intentionally absent: no submit endpoint or CAPTCHA bypass.

# Evidence-backed capability gates. A gateway flag alone no longer authorizes a
# write: each of the four gates needs a hash-verified, unexpired attestation.
# Manage it offline with:  python main.py --attest status
#                          python main.py --attest issue --gate <name> \
#                              --evidence docs/acceptance/<note>.md --reviewer <you> --days 90
# See docs/architecture/attestation.md. Omitting this section is safe: the
# default file is auto-detected and, if absent, every gate reads as unverified.
attestation:
  path: "attestations.json"
  root: "."      # evidence paths resolve against this directory

# Multi-account fan-out is validated by core/multi_account_plan.py before any
# socket opens: every account needs its OWN absolute database path and its OWN
# egress, and no (course, class) may appear twice. Two identities on one
# database would serialise each other; the same target twice is a duplicate
# booking the journal cannot deduplicate across accounts.
# accounts:
#   - name: A
#     database: "D:/kingo/budget/A.sqlite"
#     proxy: "http://127.0.0.1:7890"
#     targets:
#       - {key: a1, course_id: "K0012345", class_id: "3141592653589"}
#   - name: B
#     database: "D:/kingo/budget/B.sqlite"
#     proxy: "socks5h://127.0.0.1:1080"
#     targets:
#       - {key: b1, course_id: "K0012346", class_id: "3141592653590"}
