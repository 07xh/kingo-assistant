name: Publish verified Windows preview

on:
  push:
    branches: [main]
    paths:
      - 'clients/windows/source/RELEASE_VERSION'
      - '.github/workflows/release-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verified-windows-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate immutable release version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = (Get-Content 'clients/windows/source/RELEASE_VERSION' -Raw).Trim()
          if ($tag -notmatch '^v[0-9]+[.][0-9]+[.][0-9]+-beta[.][0-9]+$') {
            throw 'Invalid preview version in RELEASE_VERSION'
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "Release already exists: $tag; bump RELEASE_VERSION before publishing" }

      - name: Install build dependencies
        shell: pwsh
        working-directory: clients/windows/source
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw 'pip upgrade failed' }
          python -m pip install -r requirements.txt "pyinstaller>=6,<7"
          if ($LASTEXITCODE -ne 0) { throw 'Dependency install failed' }

      - name: Complete offline suite and native source GUI smoke
        shell: pwsh
        working-directory: clients/windows/source
        run: |
          python -m unittest discover -s tests -q
          if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed' }
          python windows_gui.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Source self-test failed' }
          python -c "from windows_gui import run_packaged_gui_smoke; run_packaged_gui_smoke()"
          if ($LASTEXITCODE -ne 0) { throw 'Source GUI smoke failed' }

      - name: Build Windows GUI EXE
        shell: pwsh
        working-directory: clients/windows/source
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name KingoAssistant-Windows --add-data "config.example.yaml;." --add-data "demo;demo" --collect-submodules pystray windows_gui.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller build failed' }
          python tools/verify_windows_build.py "dist/KingoAssistant-Windows.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged GUI smoke failed' }
          $report = Get-Content 'dist/build-verification.json' -Raw | ConvertFrom-Json
          if ($report.checks.offline_self_test -ne 'passed' -or $report.checks.native_tk_gui_smoke -ne 'passed') {
            throw 'Verification checks missing'
          }
          if ($report.school_api_verified -ne $false -or $report.automatic_enrollment_implemented -ne $false) {
            throw 'Unexpected production capability claim'
          }

      - name: Pack versioned assets
        shell: pwsh
        working-directory: clients/windows/source
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $tag = $env:RELEASE_TAG
          $exe = "dist/KingoAssistant-Windows-$tag.exe"
          $zip = "dist/KingoAssistant-Windows-$tag-portable.zip"
          Copy-Item 'dist/KingoAssistant-Windows.exe' $exe
          $actual = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          $report = Get-Content 'dist/build-verification.json' -Raw | ConvertFrom-Json
          if ($actual -ne $report.sha256) { throw 'Release EXE does not match validated build' }
          "$actual  KingoAssistant-Windows-$tag.exe" | Set-Content -Encoding utf8 "dist/KingoAssistant-Windows-$tag.sha256.txt"
          Compress-Archive -Path @('dist/KingoAssistant-Windows.exe', 'dist/SHA256.txt', 'dist/build-verification.json') -DestinationPath $zip -Force

      - name: Publish GitHub pre-release with verified assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $tag = $env:RELEASE_TAG
          $folder = 'clients/windows/source/dist'
          $exe = "$folder/KingoAssistant-Windows-$tag.exe"
          $zip = "$folder/KingoAssistant-Windows-$tag-portable.zip"
          $hash = "$folder/KingoAssistant-Windows-$tag.sha256.txt"
          gh release create $tag $exe $zip $hash --target $env:GITHUB_SHA --title "KingoAssistant $tag - Windows compact workbench" --notes-file 'docs/releases/v5.2.0-beta.1.md' --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publishing failed' }
