name: KingoAssistant Lite Windows alpha

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "clients/windows/lite/**"
      - "clients/windows/source/lite_bridge.py"
      - "clients/windows/source/tests/test_lite_bridge.py"
      - ".github/workflows/windows-lite-ui.yml"

permissions:
  contents: read

jobs:
  build-lite:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Python dependencies
        shell: pwsh
        working-directory: clients/windows/source
        run: |
          python -m pip install -r requirements.txt "pyinstaller>=6,<7"
          if ($LASTEXITCODE -ne 0) { throw "pip install failed" }
          python -m unittest tests.test_lite_bridge tests.test_lite_session -v
          if ($LASTEXITCODE -ne 0) { throw "Lite bridge tests failed" }
      - name: Build Python local plan sidecar
        shell: pwsh
        working-directory: clients/windows/source
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name kingo-sidecar --distpath ../lite/packaging/sidecar --add-data "config.example.yaml;." lite_bridge.py
          if ($LASTEXITCODE -ne 0) { throw "Sidecar packaging failed" }
          $response = (& ../lite/packaging/sidecar/kingo-sidecar.exe snapshot | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or !$response.ok -or $response.data.data_source -ne "local_config" -or $response.data.automatic_submit_available) { throw "Local sidecar smoke failed" }
      - name: Build frontend
        shell: pwsh
        working-directory: clients/windows/lite
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "Lite CLI dependency install failed" }
          npm --prefix frontend install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "React dependency install failed" }
          npm run icon
          if ($LASTEXITCODE -ne 0) { throw "Icon generation failed" }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "React build failed" }
      - name: Build Windows NSIS package
        shell: pwsh
        working-directory: clients/windows/lite
        run: |
          npm run tauri -- build
          if ($LASTEXITCODE -ne 0) { throw "Tauri desktop build failed" }
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (!$installer) { throw "No NSIS installer built" }
      - name: Upload experimental installer
        uses: actions/upload-artifact@v4
        with:
          name: KingoAssistant-Lite-Windows-alpha
          path: clients/windows/lite/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
