name: Windows standalone EXE

on:
  push:
    branches:
      - import/windows-v4.6
      - main
    tags:
      - "v*"
    paths:
      - "clients/windows/**"
      - "clients/android/**"
      - "docs/**"
      - "README.md"
      - "SECURITY.md"
      - ".gitignore"
      - ".github/workflows/windows-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "clients/windows/**"
      - "docs/**"
      - "README.md"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Expand V4.6 source snapshot (first run only)
        shell: pwsh
        run: |
          $sourcePath = "clients/windows/source"
          if (-not (Test-Path "$sourcePath/requirements.txt")) {
            New-Item -ItemType Directory -Force -Path $sourcePath | Out-Null
            python -c "import tarfile; tarfile.open('clients/windows/kingo-windows-v4.6.tar.xz','r:xz').extractall('clients/windows/source', filter='data')"
            if ($LASTEXITCODE -ne 0) { throw "Could not extract the Windows source snapshot" }
            if (-not (Test-Path "$sourcePath/requirements.txt")) { throw "The extracted source is incomplete" }

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $sourcePath
            git commit -m "chore: expand Windows V4.6 source snapshot"
            if ($LASTEXITCODE -ne 0) { throw "Could not commit the expanded source tree" }
            git push origin "HEAD:$env:GITHUB_REF_NAME"
            if ($LASTEXITCODE -ne 0) { throw "Could not push the expanded source tree" }
          }

      - name: Install dependencies
        shell: pwsh
        working-directory: clients/windows/source
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed" }
          python -m pip install -r requirements.txt "pyinstaller>=6,<7"
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed" }

      - name: Offline unit tests and source self-test
        shell: pwsh
        working-directory: clients/windows/source
        run: |
          python -m unittest discover -s tests -q
          if ($LASTEXITCODE -ne 0) { throw "Offline unit tests failed" }
          python windows_gui.py --self-test
          if ($LASTEXITCODE -ne 0) { throw "Source self-test failed" }

      - name: Build standalone GUI
        shell: pwsh
        working-directory: clients/windows/source
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name KingoAssistant-Windows --add-data "config.example.yaml;." --add-data "demo;demo" windows_gui.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed" }

      - name: Verify native Windows EXE and packaged Tk GUI
        shell: pwsh
        working-directory: clients/windows/source
        run: |
          python tools/verify_windows_build.py "dist/KingoAssistant-Windows.exe"
          if ($LASTEXITCODE -ne 0) { throw "Native EXE verification failed" }
          Get-Content dist/build-verification.json

      - name: Upload portable Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: KingoAssistant-Windows-portable
          path: |
            clients/windows/source/dist/KingoAssistant-Windows.exe
            clients/windows/source/dist/SHA256.txt
            clients/windows/source/dist/build-verification.json
          if-no-files-found: error
          retention-days: 14
