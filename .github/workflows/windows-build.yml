name: Windows standalone EXE

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "clients/windows/**"
      - "clients/android/**"
      - "docs/**"
      - "README.md"
      - "SECURITY.md"
      - ".gitignore"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        working-directory: clients/windows/source
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed" }
          python -m pip install -r requirements.txt "pyinstaller>=6,<7"
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed" }

      - name: Offline unit tests and source self-test
        shell: pwsh
        working-directory: clients/windows/source
        run: |
          python -m unittest discover -s tests -q
          if ($LASTEXITCODE -ne 0) { throw "Offline unit tests failed" }
          python windows_gui.py --self-test
          if ($LASTEXITCODE -ne 0) { throw "Source self-test failed" }
          python -c "from windows_gui import run_packaged_gui_smoke; run_packaged_gui_smoke()"
          if ($LASTEXITCODE -ne 0) { throw "Source GUI smoke failed" }

      - name: Build standalone GUI
        shell: pwsh
        working-directory: clients/windows/source
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name KingoAssistant-Windows --add-data "config.example.yaml;." --add-data "demo;demo" --collect-submodules pystray windows_gui.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed" }

      - name: Verify native Windows EXE and packaged Tk GUI
        shell: pwsh
        working-directory: clients/windows/source
        run: |
          python tools/verify_windows_build.py "dist/KingoAssistant-Windows.exe"
          if ($LASTEXITCODE -ne 0) { throw "Native EXE verification failed" }
          Get-Content dist/build-verification.json

      - name: Upload portable Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: KingoAssistant-Windows-portable
          path: |
            clients/windows/source/dist/KingoAssistant-Windows.exe
            clients/windows/source/dist/SHA256.txt
            clients/windows/source/dist/build-verification.json
          if-no-files-found: error
          retention-days: 14
