name: Credential history audit (redacted)
on:
  push:
    branches:
      - audit/credential-history-readonly-20261114
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history-scan:
    name: Reachable Git history / no secret values in logs
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch all public heads, tags and available pull refs
        shell: bash
        run: |
          git fetch --quiet --force origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          if git fetch --quiet --force origin '+refs/pull/*/head:refs/remotes/pr/*' 2>/dev/null; then
            echo 'PR refs collected'
          else
            echo 'PR ref discovery incomplete; only fetched branches and tags are audited'
          fi
      - name: Scan historical text blobs without logging secret values
        shell: bash
        env:
          PYTHONUTF8: '1'
        run: python .github/scripts/history_credential_scan.py
