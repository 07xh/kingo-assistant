version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/clients/windows/source"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    # The client is shipped as a PyInstaller EXE; a major jump in a parsing or
    # crypto dependency is a release decision, not an automatic merge.
    ignore:
      - dependency-name: "cryptography"
        update-types: ["version-update:semver-major"]
      - dependency-name: "lxml"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
